name: Manual Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.9.0-alpha-6); builds artifacts only'
        required: true
        type: string

permissions:
  contents: read

env:
  FPVGATE_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep aligned with tools/package_release.py and RELEASE_PROCESS.md.
        environment: [ESP32S3, FPVGateAIO, FPVGateC5MKAIO, FPVGateSolo, SeeedXIAOESP32S3, WaveshareS3ETH]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$FPVGATE_RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || { echo 'Invalid version tag'; exit 1; }
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'targets/*.ini') }}
          restore-keys: ${{ runner.os }}-pio-
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}
      - name: Build matching filesystem
        run: pio run -e ${{ matrix.environment }} -t buildfs
      - name: Package using the canonical board/partition definitions
        run: python tools/package_release.py --version "$FPVGATE_RELEASE_VERSION" --only ${{ matrix.environment }} --skip-build
      - name: Verify every packaged checksum before upload
        working-directory: release/${{ inputs.version }}
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: FPVGate-${{ inputs.version }}-${{ matrix.environment }}
          path: release/${{ inputs.version }}/
          if-no-files-found: error
          retention-days: 90

  create-release-bundle:
    needs: build-firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FPVGate-${{ inputs.version }}-*
          path: release-bundle
      - name: Create unified release package
        working-directory: release-bundle
        run: zip -r "../FPVGate-${FPVGATE_RELEASE_VERSION}-AllBoards.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: FPVGate-${{ inputs.version }}-Complete
          path: FPVGate-${{ inputs.version }}-AllBoards.zip
          if-no-files-found: error
          retention-days: 90
