; Waveshare ESP32-S3-ETH: ESP32-S3R8 (8MB octal PSRAM), 16MB flash, W5500
; 10/100 Ethernet on SPI, microSD, onboard WS2812, native USB-C, optional PoE.
; https://www.waveshare.com/wiki/ESP32-S3-ETH
;
; Pins in use on the board: W5500 GPIO9-14, microSD GPIO4-7, PSRAM GPIO33-37,
; USB GPIO19/20, WS2812 GPIO21. FPVGate's pins are in lib/CONFIG/config.h
; (WAVESHARE_S3_ETH); everything the user wires is on the left header.
[env:WaveshareS3ETH]
framework = arduino
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = targets/custom_16mb.csv
board_upload.flash_size = 16MB
upload_speed = 460800
monitor_speed = 460800
upload_resetmethod = nodemcu
board_build.f_cpu = 240000000L
; Espressif's VID/PID with RNDIS + CDC trips Windows' cached serial-JTAG
; binding; the project variant gives it a distinct PID (see ESP32S3.ini).
board_build.variants_dir = variants
board_build.variant = esp32s3_usbnet
board_build.extra_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
lib_compat_mode = strict
lib_ignore = LCD_UI, AUDIO
lib_deps =
    https://github.com/me-no-dev/AsyncTCP.git#ef448a8a1dffe4ec1b72326dd5a26211ff227b49
    https://github.com/me-no-dev/ESPAsyncWebServer.git#ad3741d159f9cfd50c567e81b67f3bef1dc6d89f
    bblanchon/ArduinoJson @7.2.0
    ayushsharma82/ElegantOTA @3.1.7
    fastled/FastLED @3.10.3
    https://github.com/Links2004/arduinoWebSockets.git#e3edca4907e8524856fbc38a6bb00eb6073c982e
build_flags =
    -DWAVESHARE_S3_ETH=1
    -DFPVGATE_ETH_W5500=1
    -DCONFIG_ASYNC_TCP_EVENT_QUEUE_SIZE=256
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -DFPVGATE_USB_NET=1
    -Wl,--wrap=dcd_edpt_open
    -Wl,--wrap=xTaskCreatePinnedToCore
    -Wl,--wrap=dcd_event_handler
    -Wl,--wrap=esp_intr_alloc
    -DCFG_TUD_ECM_RNDIS=1
    -DCFG_TUD_NET_MTU=1514
    -DARDUINO_USB_CDC_ON_BOOT=1
