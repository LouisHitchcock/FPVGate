[env:FPVGateSolo]
framework = arduino
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
board_build.filesystem = littlefs
board_build.partitions = custom_8mb.csv
board_upload.flash_size = 8MB
upload_speed = 460800
monitor_speed = 460800
board_build.f_cpu = 240000000L
; Same physical board as the AIO (seeed_xiao_esp32s3), so these match it exactly.
board_build.extra_flags =
    -DARDUINO_XIAO_ESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
lib_compat_mode = strict
lib_ignore = LCD_UI
lib_deps =
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    bblanchon/ArduinoJson @7.2.0
    ayushsharma82/ElegantOTA @^3.1.6
    fastled/FastLED @^3.7.0
build_flags = 
    -DFPVGATE_SOLO=1
    -DCONFIG_ASYNC_TCP_EVENT_QUEUE_SIZE=256
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -DFPVGATE_USB_NET=1
    -Wl,--wrap=dcd_edpt_open
    -Wl,--wrap=xTaskCreatePinnedToCore
    -DCFG_TUD_ECM_RNDIS=1
    -DCFG_TUD_NET_MTU=1514
    -DARDUINO_USB_CDC_ON_BOOT=1
