[env:ESP32S3]
framework = arduino
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
board_build.partitions = custom_8mb.csv
board_upload.flash_size = 8MB
upload_speed = 460800
monitor_speed = 460800
upload_resetmethod = nodemcu
board_build.f_cpu = 240000000L
; The stock esp32s3 variant gives the USB device 0x303A:0x1001, which is the
; same VID/PID the chip's ROM serial-JTAG uses. With USB networking the device
; becomes a composite RNDIS + CDC, and Windows matches its cached driver binding
; for "serial-JTAG" against it: RNDIS fails with code 10 and the CDC interface
; never gets a COM port. The XIAO boards avoid this only because Seeed ship a
; distinct VID.
;
; USB_VID and USB_PID cannot be overridden with a build flag: USB.cpp includes
; pins_arduino.h before its own #ifndef guards, so the variant always wins. A
; project-local variant is the only place to change them.
board_build.variants_dir = variants
board_build.variant = esp32s3_usbnet
board_build.extra_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
; Deliberately no BOARD_HAS_PSRAM here. The DevKitC-1 board definition declares
; no memory_type, unlike seeed_xiao_esp32s3 which is qio_opi, and claiming PSRAM
; the chip does not have stops it booting.
lib_compat_mode = strict
; AUDIO is unbuilt: the I2S output was never finished and this was the only
; target carrying it. See the disabled PIN_I2S_* block in lib/CONFIG/config.h.
lib_ignore = LCD_UI, AUDIO
lib_deps =
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    bblanchon/ArduinoJson @7.2.0
    ayushsharma82/ElegantOTA @^3.1.6
    fastled/FastLED @^3.7.0
    https://github.com/Links2004/arduinoWebSockets.git
build_flags = 
    -DESP32S3=1
    -DENABLE_BATTERY_TEST=1
    -DCONFIG_ASYNC_TCP_EVENT_QUEUE_SIZE=256
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -DFPVGATE_USB_NET=1
    -Wl,--wrap=dcd_edpt_open
    -Wl,--wrap=xTaskCreatePinnedToCore
    -DCFG_TUD_ECM_RNDIS=1
    -DCFG_TUD_NET_MTU=1514
    -DARDUINO_USB_CDC_ON_BOOT=1
