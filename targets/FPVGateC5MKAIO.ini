[env:FPVGateC5MKAIO]
framework = arduino
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
board_build.filesystem = littlefs
board_build.partitions = targets/partitions/custom_8mb.csv
board_upload.flash_size = 8MB
upload_speed = 460800
monitor_speed = 460800
board_build.f_cpu = 240000000L
board_build.extra_flags =
    -DARDUINO_XIAO_ESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
lib_compat_mode = strict
lib_ignore = LCD_UI
lib_deps =
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    bblanchon/ArduinoJson @7.2.0
    ayushsharma82/ElegantOTA @3.1.7
    fastled/FastLED @3.10.3
build_flags = 
    -DFPVGATE_C5MK_AIO=1
    -DCONFIG_ASYNC_TCP_EVENT_QUEUE_SIZE=256
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -DFPVGATE_USB_NET=1
    -Wl,--wrap=dcd_edpt_open
    -Wl,--wrap=xTaskCreatePinnedToCore
    -Wl,--wrap=dcd_event_handler
    -Wl,--wrap=esp_intr_alloc
    -DCFG_TUD_ECM_RNDIS=1
    -DCFG_TUD_NET_MTU=1514
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; C5MK 1.3.0 filter parity: the same 95 ms median and jump admission as
    ; the C5's native USB path, replacing the S3's extra EMA.
    -DC5_SHARED_MEDIAN_MS=95

; Explicit bench-only target. Do not package or publish as Alpha 5.
[env:FPVGateC5MKAIO_EMAProbe]
extends = env:FPVGateC5MKAIO
build_flags =
    ${env:FPVGateC5MKAIO.build_flags}
    -DC5_TIMING_DIAGNOSTIC_NO_S3_EMA=1

; UART starvation diagnosis only; do not package these as release candidates.
[env:FPVGateC5MKAIO_UARTTrace]
extends = env:FPVGateC5MKAIO
build_flags =
    ${env:FPVGateC5MKAIO.build_flags}
    -DC5_UART_TRACE=1
    -DC5_TASK_PRIORITY=3

[env:FPVGateC5MKAIO_UARTTraceHigh]
extends = env:FPVGateC5MKAIO_UARTTrace
build_flags =
    ${env:FPVGateC5MKAIO.build_flags}
    -DC5_UART_TRACE=1
    -DC5_TASK_PRIORITY=12

; Former C5MK 1.3.0 parity candidate name; identical to FPVGateC5MKAIO since rc.5.
[env:FPVGateC5MKAIO_C5MK130RC]
extends = env:FPVGateC5MKAIO
