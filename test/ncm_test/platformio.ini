; CDC-NCM spike - standalone, shares nothing with the main firmware build.
;
; ARDUINO_USB_MODE=0 selects the TinyUSB stack instead of the hardware
; USB-Serial-JTAG bridge. That is required for NCM, and it is what lets the
; device present a composite NCM + CDC configuration on one cable.
;
; The CFG_TUD_NCM_* values are normally supplied by tusb_config.h, which the
; Arduino core ships prebuilt without the net class configured, so they are
; passed on the command line for the vendored ncm_device.c instead.

[env:ncm_test]
framework = arduino
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
upload_speed = 460800
monitor_speed = 115200
board_build.f_cpu = 240000000L
; The board manifest hardcodes -DARDUINO_USB_MODE=1 in build.extra_flags, and
; build_unflags does NOT strip flags that come from there - both definitions end
; up on the command line and the last one wins. Override the manifest field
; wholesale instead; this list is the board's own, with usb_mode flipped to 0.
board_build.extra_flags =
    -DARDUINO_XIAO_ESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    -DCFG_TUD_NCM=1
    -DCFG_TUD_NET_MTU=1514
    -DCFG_TUD_NCM_IN_NTB_MAX_SIZE=3200
    -DCFG_TUD_NCM_OUT_NTB_MAX_SIZE=3200
    -DCFG_TUD_NCM_MAX_DATAGRAMS_PER_NTB=8
    -DCFG_TUD_NCM_ALIGNMENT=4
