; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs =
	targets/ESP32S3.ini
	targets/ESP32S3SuperMini.ini
	targets/LilyGOTEnergyS3.ini
	targets/SeeedXIAOESP32S3.ini
	targets/WaveshareESP32S3LCD2.ini
	targets/FPVGateAIO.ini
	targets/FPVGateSolo.ini
	targets/XIAOS3Plus.ini

; Applies to every environment. Gzips data/ into the build directory and points
; the filesystem image at the staged copy, so data/ stays uncompressed and
; editable while the device ships compressed assets. See scripts/gzip_assets.py.
[env]
extra_scripts = pre:scripts/gzip_assets.py
